# btin
# 320 ms of slack, 40 ms period. The Salon DAC is at 176.4 kHz while this
# stream is 44.1, so SoX stalls longer than an 80 ms capture buffer. The
# extra room absorbs one stall. It does not stack into the 3 s music buffer.
btin pcm * *
	# R
	[arecord] -d0 -c2 -f S16_LE -r 44100 -traw -B 320000 -F 40000 -D $FILE$
